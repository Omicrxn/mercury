name = "mercury"
compatibility_date = "2025-04-01"
routes = [
  { pattern = "mercury.uialchemy.com", custom_domain = true }
]

# Blume builds a fully static site into dist/; no Worker script is needed.
[assets]
directory = "./dist"
not_found_handling = "404-page"
# Blume links and canonical URLs have no trailing slash (/docs, /docs/api/animate).
# The default ("auto-trailing-slash") answers those with a redirect to /docs/,
# adding a round trip to every navigation; serve folder index pages directly.
html_handling = "drop-trailing-slash"
